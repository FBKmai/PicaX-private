name: Test LAN super-resolution contracts and HTTP

on:
  push:
    paths:
      - DesktopServer/**
      - BuildScripts/SuperResolution/convert.py
      - BuildScripts/SuperResolution/full_page.py
      - PicaX/Services/LanSuperResolution/**
      - PicaX/Views/Downloads/LanSuperResolutionView.swift
      - PicaX/Views/Downloads/LanSRQRCodeScanner.swift
      - PicaX/Views/Settings/Content/DownloadSettingsView.swift
      - PicaXTests/LanSuperResolutionTests.swift
      - .github/workflows/test-lan-super-resolution.yml
  pull_request:
    paths:
      - DesktopServer/**
      - BuildScripts/SuperResolution/convert.py
      - BuildScripts/SuperResolution/full_page.py
      - PicaX/Services/LanSuperResolution/**
      - PicaX/Views/Downloads/LanSuperResolutionView.swift
      - PicaX/Views/Downloads/LanSRQRCodeScanner.swift
      - PicaX/Views/Settings/Content/DownloadSettingsView.swift
      - PicaXTests/LanSuperResolutionTests.swift
      - .github/workflows/test-lan-super-resolution.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Contracts and loopback HTTP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Test stdlib contracts without model dependencies
        run: python -I -B -X utf8 DesktopServer/tests/test_contracts.py

      - name: Install transport-only dependencies (no Torch or weights)
        run: python -I -m pip install --disable-pip-version-check -r DesktopServer/requirements-transport.txt

      - name: Test real loopback HTTP without AI inference
        run: python -I -B -X utf8 DesktopServer/tests/test_http.py

  hat-numerics:
    name: HAT bounded attention CPU numerics (no checkpoints or CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install CPU-only numerical test dependencies
        run: |
          python -I -m pip install --disable-pip-version-check torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -I -m pip install --disable-pip-version-check spandrel==0.4.2
          python -I -m pip check
      - name: Compare original and bounded attention on small random CPU models
        run: python -I -B -X utf8 DesktopServer/tests/test_hat_memory.py
