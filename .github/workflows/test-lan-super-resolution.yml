name: Test LAN super-resolution contracts and HTTPS

on:
  push:
    branches:
      - iphone-duo-ios27
    paths:
      - DesktopServer/**
      - PicaX/Services/LanSuperResolution/**
      - PicaXTests/LanSuperResolutionTests.swift
      - .github/workflows/test-lan-super-resolution.yml
  pull_request:
    paths:
      - DesktopServer/**
      - PicaX/Services/LanSuperResolution/**
      - PicaXTests/LanSuperResolutionTests.swift
      - .github/workflows/test-lan-super-resolution.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Contracts and loopback HTTPS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Test stdlib contracts without model dependencies
        run: python -I -B -X utf8 DesktopServer/tests/test_contracts.py

      - name: Install transport-only dependencies (no Torch or weights)
        run: python -I -m pip install --disable-pip-version-check -r DesktopServer/requirements-transport.txt

      - name: Test real loopback HTTPS without AI inference
        run: python -I -B -X utf8 DesktopServer/tests/test_http.py
