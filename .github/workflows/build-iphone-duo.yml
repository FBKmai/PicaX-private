name: Build iPhone Duo unsigned IPA

on:
  push:
    branches:
      - iphone-duo-ios27
  workflow_dispatch:
    inputs:
      xcode_version:
        description: Xcode version (27.1 stable or 27.2 RC)
        type: choice
        default: "27.1"
        options:
          - "27.1"
          - "27.2"
      bundle_color_model:
        description: Bundle the validated color full-page model (personal noncommercial build)
        type: boolean
        default: false
      model_run_id:
        description: Validation run containing the color artifact
        type: string
        default: "42461503524"
      model_artifact:
        description: Color validation artifact name
        type: string
        default: "PicaX-full-page-color-unapproved-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: iphone-duo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned iPhone IPA
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODE_VERSION: ${{ inputs.xcode_version || '27.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode and verify iPhone Duo SDK
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Requested Xcode ${XCODE_VERSION} is not installed on this runner."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swiftc --version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          python - "$SDK_VERSION" <<'PY'
          import sys
          version = tuple(int(part) for part in sys.argv[1].split('.'))
          if version < (27, 1):
              raise SystemExit('iPhone Duo full-screen support requires iOS SDK 27.1 or newer.')
          PY
          xcodebuild -showsdks
          xcrun simctl list devices available
          {
            echo "## iPhone Duo unsigned build"
            echo "- Xcode: ${XCODE_VERSION}"
            echo "- iPhoneOS SDK: ${SDK_VERSION}"
            echo "- Target device OS: iOS 27.2 (deployment minimum unchanged)"
            echo "- Tests: iPhone Duo / iOS 27.1 simulator"
            echo "- Signing: disabled; sign the IPA yourself before installation"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test super-resolution tooling contracts without weights
        shell: bash
        run: |
          set -euo pipefail
          python -I -B BuildScripts/SuperResolution/test_convert.py
          python -I -B BuildScripts/SuperResolution/test_fetch_checkpoint.py
          python -I -B BuildScripts/SuperResolution/test_stage_bundle_model.py
          python -I -B BuildScripts/test-super-resolution-bundle.py
          python -I -B DesktopServer/tests/test_contracts.py

      - name: Stage validated color full-page model
        if: inputs.bundle_color_model == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RUN_ID: ${{ inputs.model_run_id }}
          MODEL_ARTIFACT: ${{ inputs.model_artifact }}
          MODEL_DOWNLOAD: ${{ runner.temp }}/picax-color-model
          MODEL_STAGE: ${{ github.workspace }}/build/SuperResolutionBundle
        run: |
          set -euo pipefail
          if [[ ! "$MODEL_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::model_run_id must be numeric."
            exit 1
          fi
          if [[ ! "$MODEL_ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::model_artifact contains unsupported characters."
            exit 1
          fi
          rm -rf "$MODEL_DOWNLOAD" "$MODEL_STAGE"
          mkdir -p "$MODEL_DOWNLOAD"
          gh run download "$MODEL_RUN_ID" --name "$MODEL_ARTIFACT" --dir "$MODEL_DOWNLOAD"
          python -I -B BuildScripts/SuperResolution/stage_bundle_model.py \
            --artifact-dir "$MODEL_DOWNLOAD" \
            --output-dir "$MODEL_STAGE" \
            --preset color \
            --expected-weight-sha256 8ff2ba0b970e6939f3711077f5260fcded16b8388a939a27f153c687ff5da3e0 \
            --expected-package-sha256 94f6697f579a45e18fd9247b59e0fe236a52506b3e20807799747438a0b75b13 \
            --validation-run-id "$MODEL_RUN_ID" \
            --artifact-name "$MODEL_ARTIFACT"
          {
            echo ""
            echo "## Color full-page model staged"
            echo "- Validation run: ${MODEL_RUN_ID}"
            echo "- Artifact: ${MODEL_ARTIFACT}"
            echo "- License: CC-BY-NC-4.0 (personal noncommercial use only)"
            echo "- Numeric validation: macOS Core ML CPU-only at all five mandated sizes;"
            echo "  cpuAndGPU and all at 256x384 and 1000x1500. iPhone Duo is still unverified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run iPhone Duo tests and package unsigned IPA
        shell: bash
        env:
          SUPER_RESOLUTION_BUNDLE_DIR: ${{ inputs.bundle_color_model == true && format('{0}/build/SuperResolutionBundle', github.workspace) || '' }}
        run: bash BuildScripts/build-iphone-unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PicaX-iPhoneDuo-unsigned-${{ github.run_number }}${{ inputs.bundle_color_model == true && '-color' || '' }}
          path: |
            build/iPhoneDuo/PicaX-iPhoneDuo-unsigned.ipa
            build/iPhoneDuo/ReleaseNotes.json
            build/iPhoneDuo/ReleaseNotes.md
            build/iPhoneDuo/PicaXBuildEnvironment.plist
            build/iPhoneDuo/SHA256SUMS.txt
            build/iPhoneDuo/SuperResolutionModels.json
            build/iPhoneDuo/SuperResolution.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and simulator test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PicaX-iPhoneDuo-diagnostics-${{ github.run_number }}
          path: |
            build/iPhoneDuo/*.log
            build/iPhoneDuo/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
