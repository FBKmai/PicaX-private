name: Validate full-page Core ML super-resolution

on:
  push:
    branches: [iphone-duo-ios27]
    paths:
      - "BuildScripts/SuperResolution/**"
      - "BuildScripts/verify-super-resolution-bundle.py"
      - "BuildScripts/test-super-resolution-bundle.py"
      - ".github/workflows/validate-super-resolution-full-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-resolution-full-page-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-page:
    name: Full page ${{ matrix.model }} (macOS engineering evidence, not iPhone)
    runs-on: xcode-27
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: manga
            model_args: "--model manga --manga-height 1200 --minimum-page-height 1200 --maximum-page-height 1200"
            weight_file: "2x_MangaJaNai_1200p_V1_ESRGAN_70k.pth"
            expected_sha256: "43b784f674bdbf89886a62a64cd5f8d8df92caf4d861bdf4d47dad249ede0267"
            resource_name: "MangaJaNai_V1_1200p_2x_float32"
          - model: color
            model_args: "--model color"
            weight_file: "2x_IllustrationJaNai_V3detail_FDAT_M_unshuffle_40k_fp16.safetensors"
            expected_sha256: "8ff2ba0b970e6939f3711077f5260fcded16b8388a939a27f153c687ff5da3e0"
            resource_name: "IllustrationJaNai_V3detail_FDAT_M_2x_float32"
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - name: Checkout trusted conversion code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          uname -m

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          architecture: arm64

      - name: Install hash-locked environment and run stdlib tests
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -I -m venv "$RUNNER_TEMP/picax-sr-venv"
          PY="$RUNNER_TEMP/picax-sr-venv/bin/python"
          "$PY" -I -m pip install --require-hashes --only-binary=:all: \
            -r "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/requirements-macos-arm64-py311.txt"
          "$PY" -I -m pip check
          "$PY" -I -B "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/test_convert.py"
          "$PY" -I -B "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/test_fetch_checkpoint.py"
          "$PY" -I -B "$GITHUB_WORKSPACE/BuildScripts/test-super-resolution-bundle.py"

      - name: Fetch and hash ${{ matrix.model }} checkpoint
        id: fetch
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/fetch_checkpoint.py" \
            --model "${{ matrix.model }}" \
            --download-dir "$RUNNER_TEMP/picax-${{ matrix.model }}-download" \
            --weight-dir "$RUNNER_TEMP/picax-${{ matrix.model }}-weights"
          mkdir -p "$RUNNER_TEMP/picax-fullpage/${{ matrix.model }}"
          cp "$RUNNER_TEMP/picax-${{ matrix.model }}-weights/checkpoint-source.json" \
            "$RUNNER_TEMP/picax-fullpage/${{ matrix.model }}/checkpoint-source.json"

      - name: Export dynamic full-page package and check one CPU prediction
        id: convert
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picax-sr-venv/bin/python" -I \
            "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/convert.py" \
            ${{ matrix.model_args }} \
            --weight "$RUNNER_TEMP/picax-${{ matrix.model }}-weights/${{ matrix.weight_file }}" \
            --expected-sha256 "${{ matrix.expected_sha256 }}" \
            --precision float32 \
            --output-dir "$RUNNER_TEMP/picax-fullpage/${{ matrix.model }}" \
            --max-abs-error 0.00784313725490196 \
            --max-mean-error 0.000392156862745098 \
            --full-page --full-page-alignment 16 \
            --full-page-max-side 2048 --full-page-max-pixels 2000000 \
            --full-page-timeout 1500 --full-page-memory-mb 12288

      - name: Validate every required size and compute unit in isolated workers
        id: validate
        if: ${{ !cancelled() && steps.convert.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picax-sr-venv/bin/python" -B \
            "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/validate_full_page.py" validate \
            --model "${{ matrix.model }}" \
            --weight "$RUNNER_TEMP/picax-${{ matrix.model }}-weights/${{ matrix.weight_file }}" \
            --expected-sha256 "${{ matrix.expected_sha256 }}" \
            --package "$RUNNER_TEMP/picax-fullpage/${{ matrix.model }}/${{ matrix.resource_name }}.mlpackage" \
            --resource-name "${{ matrix.resource_name }}" \
            --output-dir "$RUNNER_TEMP/picax-fullpage/${{ matrix.model }}" \
            --size 256x384 --size 512x768 --size 768x1152 \
            --size 1000x1500 --size 999x1501 \
            --alignment 16 --max-side 2048 --max-pixels 2000000 \
            --timeout 1500 --memory-mb 12288 \
            --units cpuOnly,cpuAndGPU,all \
            --all-units-at 256x384 --all-units-at 1000x1500 \
            --max-abs-error 0.00784313725490196 \
            --max-mean-error 0.000392156862745098

      - name: Record engineering summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Full-page ${{ matrix.model }} Core ML"
            echo '- macOS arm64 only; a passing run is not iPhone Duo or visual-quality acceptance.'
            echo '- Required numerical gate: CPU_ONLY Core ML versus PyTorch on the same padded input.'
            echo '- Preselected limits: max 2/255, mean 0.1/255 (normalized RGB).'
            echo '- GPU/Neural Engine figures report whichever compute unit Core ML actually selected.'
          } >> "$GITHUB_STEP_SUMMARY"
          report="$RUNNER_TEMP/picax-fullpage/${{ matrix.model }}/${{ matrix.resource_name }}.fullpage.json"
          if [ -f "$report" ]; then
            "$RUNNER_TEMP/picax-sr-venv/bin/python" -B \
              "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/validate_full_page.py" summary "$report" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No full-page report was produced (conversion or validation failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full-page packages, reports and PNG evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PicaX-full-page-${{ matrix.model }}-unapproved-${{ github.run_number }}
          path: ${{ runner.temp }}/picax-fullpage/${{ matrix.model }}
          if-no-files-found: warn
          retention-days: 7
