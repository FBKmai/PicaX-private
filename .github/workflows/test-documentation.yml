name: Test documentation and onboarding contracts

on:
  push:
    paths:
      - '**/*.md'
      - BuildScripts/test_documentation.py
      - DesktopServer/picax_lan/cli.py
      - DesktopServer/picax_lan/hat_memory.py
      - DesktopServer/picax_lan/models.py
      - DesktopServer/fetch_models.py
      - DesktopServer/validate_local.py
      - DesktopServer/validate_transport.py
      - .github/workflows/**
  pull_request:
    paths:
      - '**/*.md'
      - BuildScripts/test_documentation.py
      - DesktopServer/picax_lan/cli.py
      - DesktopServer/picax_lan/hat_memory.py
      - DesktopServer/picax_lan/models.py
      - DesktopServer/fetch_models.py
      - DesktopServer/validate_local.py
      - DesktopServer/validate_transport.py
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Offline links and deployment contracts (stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check links, command options and onboarding contracts
        run: python -I -B -X utf8 BuildScripts/test_documentation.py
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
