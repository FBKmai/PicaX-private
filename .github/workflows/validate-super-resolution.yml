name: Validate real Core ML super-resolution candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-resolution-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    name: Convert and compare real weights (not approved for bundling)
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"

    steps:
      - name: Checkout trusted conversion code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          uname -m

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          architecture: arm64

      - name: Install hash-locked conversion environment
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -I -m venv "$RUNNER_TEMP/picax-sr-venv"
          PY="$RUNNER_TEMP/picax-sr-venv/bin/python"
          "$PY" -I -m pip install --require-hashes --only-binary=:all: \
            -r "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/requirements-macos-arm64-py311.txt"
          "$PY" -I -m pip check
          "$PY" -I -B "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/test_convert.py"
          "$PY" -I -B "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/test_fetch_checkpoint.py"
          mkdir "$RUNNER_TEMP/picax-sr-reports"
          {
            echo '## Real-model numerical engineering validation'
            echo '- Fixed macOS arm64 / CPython 3.11.9 environment; hash-locked dependencies.'
            echo '- No upload to Releases, no app resource integration, no validated flag changes.'
            echo '- Preselected float32 limits: max 2/255, mean 0.1/255.'
            echo '- Color float16 was rejected in validation run 42447624740; it is not retried or bundled.'
            echo '- Preselected tiled/full limits: max 0.05, mean 0.005, seam mean 0.0075 (normalized RGB).'
            echo '- These are numerical engineering limits, not visual-quality acceptance.'
            echo '- Manga candidate matches only source height 1200; no invented wider range.'
            echo '- Licensing, full-page/tiled seams and real-device acceptance remain separate gates.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and hash selected Manga checkpoint
        id: manga
        shell: bash
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/fetch_checkpoint.py" \
            --model manga --download-dir "$RUNNER_TEMP/picax-manga-download" \
            --weight-dir "$RUNNER_TEMP/picax-manga-weights"
          cp "$RUNNER_TEMP/picax-manga-weights/checkpoint-source.json" \
            "$RUNNER_TEMP/picax-sr-reports/manga-checkpoint-source.json"

      - name: Convert Manga 1200p float32 and compare CPU predictions
        if: ${{ !cancelled() && steps.manga.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picax-sr-venv/bin/python" -I \
            "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/convert.py" \
            --model manga --manga-height 1200 --minimum-page-height 1200 --maximum-page-height 1200 \
            --weight "$RUNNER_TEMP/picax-manga-weights/2x_MangaJaNai_1200p_V1_ESRGAN_70k.pth" \
            --expected-sha256 43b784f674bdbf89886a62a64cd5f8d8df92caf4d861bdf4d47dad249ede0267 \
            --precision float32 --output-dir "$RUNNER_TEMP/picax-sr-reports/manga-float32" \
            --max-abs-error 0.00784313725490196 --max-mean-error 0.000392156862745098 \
            --validate-tiles --max-tile-abs-error 0.05 --max-tile-mean-error 0.005 \
            --max-seam-mean-error 0.0075

      - name: Fetch and hash selected color checkpoint
        id: color
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/fetch_checkpoint.py" \
            --model color --download-dir "$RUNNER_TEMP/picax-color-download" \
            --weight-dir "$RUNNER_TEMP/picax-color-weights"
          cp "$RUNNER_TEMP/picax-color-weights/checkpoint-source.json" \
            "$RUNNER_TEMP/picax-sr-reports/color-checkpoint-source.json"

      - name: Convert color float32 and compare CPU predictions
        if: ${{ !cancelled() && steps.color.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picax-sr-venv/bin/python" -I \
            "$GITHUB_WORKSPACE/BuildScripts/SuperResolution/convert.py" \
            --model color \
            --weight "$RUNNER_TEMP/picax-color-weights/2x_IllustrationJaNai_V3detail_FDAT_M_unshuffle_40k_fp16.safetensors" \
            --expected-sha256 8ff2ba0b970e6939f3711077f5260fcded16b8388a939a27f153c687ff5da3e0 \
            --precision float32 --output-dir "$RUNNER_TEMP/picax-sr-reports/color-float32" \
            --max-abs-error 0.00784313725490196 --max-mean-error 0.000392156862745098 \
            --validate-tiles --max-tile-abs-error 0.05 --max-tile-mean-error 0.005 \
            --max-seam-mean-error 0.0075

      - name: Upload unapproved model packages and numerical evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PicaX-SuperResolution-unapproved-${{ github.run_number }}
          path: ${{ runner.temp }}/picax-sr-reports
          if-no-files-found: warn
          retention-days: 7
